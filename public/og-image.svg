<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B18"/>
      <stop offset="1" stop-color="#151311"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#B4552D" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#B4552D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- fine grid / texture hint -->
  <g stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="158" x2="1200" y2="158"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
  </g>

  <!-- left accent mark -->
  <rect x="90" y="112" width="6" height="78" rx="3" fill="#B4552D"/>

  <!-- eyebrow -->
  <text x="120" y="150" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="10" fill="#D28A5E">AI ENGINEER</text>

  <!-- name -->
  <text x="120" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="108" font-weight="600" fill="#FAF8F5">Ansh Anand</text>

  <!-- rule -->
  <rect x="122" y="352" width="150" height="7" rx="3.5" fill="#B4552D"/>

  <!-- tagline -->
  <text x="122" y="452" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="400" letter-spacing="1" fill="#E6E0D8">Building practical AI-powered applications.</text>

  <!-- bottom signature -->
  <text x="120" y="556" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="4" fill="#6B6660">anshh-py · anshanand317@gmail.com</text>
</svg>
